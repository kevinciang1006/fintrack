<div class="grid grid-cols-1 md:grid-cols-2 gap-5">
  <div class="bg-white dark:bg-gray-900 rounded-2xl border border-gray-100 dark:border-gray-800 p-5 shadow-sm">
    <h3 class="text-sm font-semibold text-gray-700 dark:text-gray-300 mb-1">Principal vs Interest</h3>
    <p class="text-xs text-gray-400 dark:text-gray-500 mb-4">Total cost breakdown</p>
    <div class="h-60">
      <canvas baseChart [data]="doughnutData()" [options]="doughnutOptions" type="doughnut"></canvas>
    </div>
  </div>
  <div class="bg-white dark:bg-gray-900 rounded-2xl border border-gray-100 dark:border-gray-800 p-5 shadow-sm">
    <h3 class="text-sm font-semibold text-gray-700 dark:text-gray-300 mb-1">Remaining Balance</h3>
    <p class="text-xs text-gray-400 dark:text-gray-500 mb-4">Balance reduction over time</p>
    <div class="h-60">
      <canvas baseChart [data]="lineData()" [options]="lineOptions" type="line"></canvas>
    </div>
  </div>
</div>
