<div class="bg-white dark:bg-gray-900 rounded-2xl border border-gray-100 dark:border-gray-800 p-5 shadow-sm">
  <div class="flex items-center gap-3 mb-4">
    <div class="w-8 h-8 rounded-full bg-gradient-to-br from-amber-400 to-orange-500 flex items-center justify-center shrink-0">
      <mat-icon class="text-white text-sm">candlestick_chart</mat-icon>
    </div>
    <div>
      <h3 class="text-base font-semibold text-gray-900 dark:text-white">{{ coinName() }}</h3>
      <p class="text-xs text-gray-400 dark:text-gray-500">7-Day OHLC Candlestick</p>
    </div>
  </div>

  @if (ohlcQuery.isPending()) {
    <div class="flex flex-col items-center justify-center h-80 gap-3">
      <mat-spinner diameter="36" />
      <p class="text-sm text-gray-400">Loading chart data…</p>
    </div>
  } @else if (ohlcQuery.isError()) {
    <div class="flex flex-col items-center justify-center h-80 gap-2 text-gray-400">
      <mat-icon class="text-4xl">bar_chart_off</mat-icon>
      <p class="text-sm">Chart data unavailable</p>
    </div>
  } @else {
    <div #chartContainer class="w-full h-80 rounded-lg overflow-hidden"></div>
  }
</div>
