<div class="grid grid-cols-1 md:grid-cols-2 gap-5">
  <div class="bg-white dark:bg-gray-900 rounded-2xl border border-gray-100 dark:border-gray-800 p-5 shadow-sm">
    <h3 class="text-sm font-semibold text-gray-700 dark:text-gray-300 mb-1">Monthly Cash Flow</h3>
    <p class="text-xs text-gray-400 dark:text-gray-500 mb-4">Income vs expenses over last 6 months</p>
    <div class="h-60">
      <canvas baseChart [data]="barData()" [options]="barOptions" type="bar"></canvas>
    </div>
  </div>
  <div class="bg-white dark:bg-gray-900 rounded-2xl border border-gray-100 dark:border-gray-800 p-5 shadow-sm">
    <h3 class="text-sm font-semibold text-gray-700 dark:text-gray-300 mb-1">Spending by Category</h3>
    <p class="text-xs text-gray-400 dark:text-gray-500 mb-4">Expenses distribution</p>
    <div class="h-60">
      <canvas baseChart [data]="pieData()" [options]="pieOptions" type="pie"></canvas>
    </div>
  </div>
</div>
