<div class="bg-white dark:bg-gray-900 rounded-2xl border border-gray-100 dark:border-gray-800 p-5 flex items-center gap-4 shadow-sm">
  @if (icon()) {
    <div class="w-12 h-12 rounded-xl flex items-center justify-center shrink-0" [class]="iconBgClass()">
      <mat-icon class="text-white text-xl">{{ icon() }}</mat-icon>
    </div>
  }
  <div class="min-w-0">
    <p class="text-xs font-medium text-gray-500 dark:text-gray-400 uppercase tracking-wider truncate">{{ label() }}</p>
    <p class="text-2xl font-bold text-gray-900 dark:text-white mt-0.5 tabular-nums">{{ value() }}</p>
  </div>
</div>
