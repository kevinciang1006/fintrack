name: Deploy Frontend to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Inject Railway API URL
        env:
          RAILWAY_API_URL: ${{ secrets.RAILWAY_API_URL }}
        run: |
          sed -i "s|RAILWAY_API_URL_PLACEHOLDER|${RAILWAY_API_URL}|g" \
            src/environments/environment.production.ts

      - name: Build for production
        run: npm run build -- --base-href /fintrack/

      - name: Copy index.html to 404.html for SPA deep-link routing
        run: cp dist/fintrack/browser/index.html dist/fintrack/browser/404.html

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist/fintrack/browser
