name: Validate Backend (Railway)

on:
  push:
    branches:
      - main
    paths:
      - 'server/**'
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: server

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: server/package-lock.json

      - name: Install server dependencies
        run: npm install

      - name: Start server and smoke test
        run: |
          node index.js &
          SERVER_PID=$!
          sleep 3
          curl --fail http://localhost:3001/transactions
          kill $SERVER_PID
